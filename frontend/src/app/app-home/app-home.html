<nav>
    <img
        src="/logo-nav.svg"
        width="100"
        height="100"
        alt="Pomo Logo"
    />
    <ul>
        <li>
            <a (click)="styleNavArea($event)" [routerLink]="['activities']">ACTIVITIES</a>
        </li>
        <li>
            <a (click)="styleNavArea($event)" [routerLink]="['timer']">POMO TIMER</a>
        </li>
        <li>
            <a (click)="styleNavArea($event)" [routerLink]="['study']">STUDY ZONE</a>
        </li>
    </ul>
    <button (click)="setProfile()">
        <img
            [src]="this.hasPhoto() ? this.profilePhotoUrl : '/Profile/Profile_Photo.svg'"
            width="80"
            height="80"
            alt="profile photo"
        />
    </button>
</nav>

<main>
    <!-- Profile page displayed here (will be displayed at the center of the page over the content)-->
    @if(this.profileOn()){
        <app-profile-page [userInfos]="this.userDTO()" (close)="this.setProfile()"></app-profile-page>
    }
    <!-- Application content here -->
    <router-outlet></router-outlet>
</main>

<footer>
    <section id="find-out-more-sect">
        <h3>Find out more</h3>
        <ul>
            <li>
                <a href="">Pomodoro technique</a>
            </li>
            <li>
                <a href="">Active recall</a>
            </li>
        </ul>
    </section>
    <section id="help-center-sect">
        <h3>Help center</h3>
        <ul>
            <li>
                <a href="">FAQ page</a>
            </li>
            <li>
                <a href="">Contact us</a>
            </li>
        </ul>
    </section>
    <div id="footer-down">
        <p>
            <small>©2026 - Pomo | All rights reserved</small>
        </p>
        <span>POMO</span>
    </div>
</footer>
