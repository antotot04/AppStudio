<button>
    <img
        src="/Timer/Settings.svg"
        width="90"
        height="90"
        alt="timer settings"
    />
</button>

<button>
    <img
        src="/Timer/Leaderboard.svg"
        width="90"
        height="90"
        alt="timer leaderboard"
    />
</button>

<div class="timer-status">
    @if(timerState() === "short"){
        Short Pause
    }@else if(timerState() === "long"){
        Long Pause
    }@else{
        Pomodoro
    }
</div>

<div class="timer-container">
    <div class="timer">
        {{ currentTime() * 1000 | date:'mm:ss' }}
    </div>
    @if(onPause()){
        <button (click)="onPlay()">
            <img
                src="/Timer/Play.svg"
                width="85"
                height="85"
                alt="play icon"
            />
        </button>
    }@else{
        <button (click)="onStop()">
            <img
                src="/Timer/Pause.svg"
                width="85"
                height="85"
                alt="pause icon"
            />
        </button>
    }

    @if(timerState() === "short" || timerState() === "long"){
        <button (click)="onSkip()">
            <img
                src="/Timer/Skip.svg"
                width="85" 
                height="85"
                alt="skip icon"
            />
        </button>
    }

    <div class="progress-bar-container">
        <div class="progress">
        </div>
    </div>
</div>
